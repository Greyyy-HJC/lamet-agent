[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamet-agent"
version = "0.1.0"
description = "Minimal LaMET agent scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "gvar",
  "gmpy2",
  "mpmath",
  "lsqfit",
  "xarray",
  "h5py",
  "netCDF4",
  "prompt_toolkit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
codex = ["openai-codex"]
literature = ["beautifulsoup4", "requests"]

[project.scripts]
lamet-agent = "lamet_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lamet_agent*"]

# `formulas/*.md` are the precomputed matching formulas: shipping them means the matching
# report's formula section renders with no arXiv download and no LLM call, even on a
# user's very first run. Regenerate with `lamet-agent precompute-formulas`.
[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "kernels/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["lamet_agent"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203", "E701"]
external = ["E704", "W503"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false
